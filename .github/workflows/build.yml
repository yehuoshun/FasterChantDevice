name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_DIR: src/FasterChantDevice
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "$env:PROJECT_DIR/FasterChantDevice.csproj")
          $ver = $xml.Project.PropertyGroup.Version
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Restore
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Publish (single file)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dotnet publish --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/single-file

      - name: Publish (portable)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dotnet publish --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -o publish/portable

      - name: Zip artifacts
        working-directory: ${{ env.PROJECT_DIR }}/publish
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          Compress-Archive -Path portable/* -DestinationPath "FasterChantDevice-v${ver}-portable-x64.zip"
          Move-Item -Path single-file/FasterChantDevice.exe -Destination "FasterChantDevice-v${ver}-x64.exe"

      - name: Upload Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            src/FasterChantDevice/publish/FasterChantDevice-v${{ steps.version.outputs.version }}-portable-x64.zip
            src/FasterChantDevice/publish/FasterChantDevice-v${{ steps.version.outputs.version }}-x64.exe

  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: yehuoshun/yehuoshun-notify@main
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}

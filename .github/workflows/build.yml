name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_DIR: src/300FasterChantDevice
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Publish (single file)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dotnet publish --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/single-file

      - name: Publish (portable)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dotnet publish --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -o publish/portable

      - name: Zip portable
        working-directory: ${{ env.PROJECT_DIR }}/publish
        run: Compress-Archive -Path portable/* -DestinationPath 300FasterChantDevice-portable-x64.zip

      - name: Upload Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          draft: false
          prerelease: true
          files: |
            src/300FasterChantDevice/publish/300FasterChantDevice-portable-x64.zip
            src/300FasterChantDevice/publish/single-file/300FasterChantDevice.exe

  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: yehuoshun/yehuoshun-notify@main
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
